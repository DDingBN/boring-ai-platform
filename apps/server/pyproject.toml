[project]
name = "boring-ai-server"
version = "0.1.0"
description = "FastAPI and LangChain backend for Boring AI Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-deepseek>=1.0.0,<2.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.4.0,<10.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
